<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英語バトル</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #5f6f8a;
      --line: #dbe4f0;
      --accent: #ef3f54;
      --bg: #f5f8fc;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      line-height: 1.75;
    }
    main {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0;
    }
    .hero {
      padding: 42px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 18px 48px rgba(25, 44, 80, .08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 56px);
      letter-spacing: 0;
      line-height: 1.16;
    }
    p { margin: 0 0 18px; color: var(--muted); }
    .links {
      display: grid;
      gap: 14px;
      margin-top: 30px;
    }
    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink);
      text-decoration: none;
      background: #fff;
      font-weight: 700;
    }
    a:hover { border-color: var(--accent); }
    small { display: block; margin-top: 28px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>英語バトル</h1>
      <p>英検・TOEICの頻出単語と熟語を、4択クイズと対戦モードでテンポよく学べる英語学習アプリです。</p>
      <div class="links">
        <a href="./support/">サポート</a>
        <a href="./privacy/">プライバシーポリシー</a>
      </div>
      <small>© 2026 Yuki Shiiyama</small>
    </section>
  </main>
</body>
</html>
